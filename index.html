<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智谱清言风 Mermaid Theme</title>
</head>
<body>
  <main class="page-shell">
    <header>
      <p class="eyebrow">MERMAID 11.16.1 · CLEAN-ROOM RECONSTRUCTION</p>
      <h1>智谱清言风 Mermaid 主题</h1>
      <p class="lede">复刻品牌色板，并修复 Timeline TD 的 section 遮挡与横向长文本不换行。</p>
    </header>

    <section class="playground">
      <div class="toolbar">
        <label>示例
          <select id="preset">
            <option value="timeline">Timeline</option>
            <option value="graph">Graph / Flowchart</option>
            <option value="gantt">Gantt</option>
          </select>
        </label>
        <label>布局
          <select id="layout">
            <option value="auto">自动</option>
            <option value="mobile">移动端纵向</option>
            <option value="desktop">PC 横向</option>
          </select>
        </label>
        <label class="width-control">预览宽度
          <input id="width" type="range" min="320" max="1200" step="10" value="920">
          <output id="width-output">920px</output>
        </label>
        <button id="render" type="button">重新渲染</button>
        <button id="copy-svg" class="secondary" type="button">复制 SVG</button>
        <button id="download-svg" class="secondary" type="button">下载 SVG</button>
      </div>
      <div class="workspace">
        <label class="source-panel">Mermaid 源码
          <textarea id="source" spellcheck="false">timeline
    title 产品演进
    section 起步
        需求验证与用户访谈 : 验证产品方向并形成最小可行产品方案
        第一版正式发布 : 完成核心功能开发、联调与上线
    section 成长
        体验与性能持续优化 : 完善复杂场景下的交互体验与响应性能
        规模化推广 : 扩展更多业务场景并建立稳定运营体系</textarea>
        </label>
        <div class="preview-panel">
          <div id="preview-frame"><div id="preview"></div></div>
        </div>
      </div>
    </section>

    <section class="diagram-grid">
      <article><h2>Graph / Flowchart</h2><div id="graph-demo" class="diagram"></div></article>
      <article><h2>Gantt</h2><div id="gantt-demo" class="diagram"></div></article>
    </section>
  </main>
    <script src="./vendor/mermaid.min.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
