<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="支持实时预览、自由缩放与多格式导出的 Mermaid 在线编辑器。">
  <title>Mermaid 在线编辑器</title>
  <link rel="icon" href="./icons/mermaid.svg" type="image/svg+xml">
  <script>document.documentElement.dataset.theme=localStorage.getItem("mermaid-editor-theme")||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light")</script>
  <style>html{background:#fff}html[data-theme="dark"]{background:#0f1117}body{margin:0}.brand img{width:26px;height:26px}.topbar svg,.active-tab svg,.floating-toolbar svg{width:16px;height:16px}.app-shell{opacity:0}.boot-splash{position:fixed;z-index:9999;inset:0;display:grid;place-items:center;background:inherit;transition:opacity .16s ease}.boot-splash img{width:34px;height:34px;animation:boot-pulse 1s ease-in-out infinite alternate}html.app-ready .app-shell{opacity:1;transition:opacity .16s ease}html.app-ready .boot-splash{opacity:0;pointer-events:none}@keyframes boot-pulse{to{transform:scale(.9);opacity:.58}}</style>
</head>
<body>
  <div class="boot-splash" aria-hidden="true"><img src="./icons/mermaid.svg" width="34" height="34" alt=""></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Mermaid 在线编辑器首页">
        <img src="./icons/mermaid.svg" width="26" height="26" alt="">
        <strong>Mermaid 在线编辑器</strong>
      </a>
      <nav class="topnav" aria-label="主导航">
        <a href="./demo/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z"/></svg>Gallery</a>
        <a href="https://github.com/Jeoitim/zhipu-mermaid-theme" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7A11.3 11.3 0 0 0 8.4 22.8c.6.1.8-.2.8-.6v-2.1c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.4 3.6 1.1.1-.8.4-1.4.8-1.7-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A11.3 11.3 0 0 0 12 .7Z"/></svg>GitHub</a>
        <button id="theme-toggle" class="theme-toggle" type="button" title="切换明暗模式" aria-label="切换明暗模式"><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8a8.5 8.5 0 1 0 11.6 11.6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 1h2v3h-2V1Zm0 19h2v3h-2v-3ZM1 11h3v2H1v-2Zm19 0h3v2h-3v-2ZM4.2 2.8 6.3 5 4.9 6.4 2.8 4.2l1.4-1.4Zm12.9 14.8 1.4-1.4 2.2 2.1-1.4 1.4-2.2-2.1ZM2.8 19.8l2.1-2.2L6.3 19l-2.1 2.2-1.4-1.4ZM17.6 4.9l2.2-2.1 1.4 1.4L19 6.3l-1.4-1.4ZM12 6a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg></button>
        <details id="actions-menu" class="actions-menu">
          <summary title="导出与分享" aria-label="导出与分享"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></summary>
          <div class="actions-popover">
            <header><strong>导出图表</strong><small>全部在浏览器本地完成</small></header>
            <div class="export-size">
              <span>PNG 尺寸</span>
              <label><input type="radio" name="png-size" value="auto" checked> 自动 2×</label>
              <label><input type="radio" name="png-size" value="width"> 宽度</label>
              <input id="png-width" type="number" min="320" max="10000" value="1920" disabled aria-label="PNG 宽度">
            </div>
            <div class="action-grid">
              <button id="download-png" type="button"><b>↓</b><span>PNG<small>高清位图</small></span></button>
              <button id="download-svg" type="button"><b>↓</b><span>SVG<small>可编辑矢量图</small></span></button>
              <button id="download-source" type="button"><b>↓</b><span>Mermaid<small>.mmd 源码</small></span></button>
            </div>
            <hr>
            <button id="copy-svg" class="wide-action" type="button">复制 SVG</button>
            <button id="copy-source" class="wide-action" type="button">复制 Mermaid 源码</button>
            <button id="share-link" class="wide-action" type="button">复制分享链接</button>
          </div>
        </details>
      </nav>
    </header>

    <main id="editor-shell" class="editor-shell">
      <section class="pane source-pane" aria-label="Mermaid 源码编辑区">
        <div class="pane-tabs">
          <button class="active-tab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5-7 7 7 7 1.5-1.5L4 12l5.5-5.5L8 5Zm8 0-1.5 1.5L20 12l-5.5 5.5L16 19l7-7-7-7Z"/></svg>Code</button>
          <div class="source-actions">
            <label><select id="preset" aria-label="图表类型"><option value="timeline">Timeline</option><option value="flowchart">Flowchart</option><option value="sequence">Sequence</option><option value="class">Class</option><option value="state">State</option><option value="er">ER</option><option value="gantt">Gantt</option><option value="pie">Pie</option><option value="journey">Journey</option><option value="git">Git Graph</option><option value="mindmap">Mindmap</option><option value="quadrant">Quadrant</option><option value="xychart">XY Chart</option><option value="requirement">Requirement</option><option value="kanban">Kanban</option><option value="block">Block</option><option value="custom">Custom</option></select></label>
            <label id="layout-control"><select id="layout" aria-label="Timeline 布局"><option value="auto">自适应</option><option value="mobile">移动纵向</option><option value="desktop">桌面横向</option></select></label>
          </div>
        </div>
        <div id="source-editor" class="source-editor" aria-label="Mermaid 源码"></div>
      </section>

      <div id="split-handle" class="split-handle" role="separator" aria-label="拖动调整编辑器与预览宽度" aria-orientation="vertical" tabindex="0"><span></span></div>

      <section id="preview-pane" class="pane preview-pane" aria-label="图表预览区">
        <div id="preview-surface" class="preview-surface" tabindex="0">
          <div id="preview" class="preview"></div>
          <div id="render-error" class="render-error" hidden></div>
          <div id="render-width-popover" class="render-width-popover" hidden><label><input id="render-width" type="range" min="320" max="2000" step="20" value="480" aria-label="Mermaid 渲染宽度"><output id="render-width-value" for="render-width">480px</output></label></div>
          <div class="floating-toolbar" aria-label="图表视图控制">
            <button id="fit" type="button" title="适应画布" aria-label="适应画布"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6v2H5v4H3Zm12-6h6v6h-2V5h-4V3ZM5 15v4h4v2H3v-6h2Zm14 0h2v6h-6v-2h4v-4ZM8 8h8v8H8V8Zm2 2v4h4v-4h-4Z"/></svg></button>
            <button id="width-toggle" type="button" title="渲染宽度" aria-label="渲染宽度" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2v14H3V5Zm16 0h2v14h-2V5ZM7 11h10v2H7v-2Zm2.5-3L6 12l3.5 4v-3h5v3l3.5-4-3.5-4v3h-5V8Z"/></svg></button>
            <i></i>
            <button id="zoom-out" type="button" title="缩小" aria-label="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 3.93 11.68L19.75 21 21 19.75l-5.32-5.32A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9ZM8 9.5h5v2H8v-2Z"/></svg></button>
            <button id="zoom-level" class="zoom-level" type="button" title="重置并适应画布">100%</button>
            <button id="zoom-in" type="button" title="放大" aria-label="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 3.93 11.68L19.75 21 21 19.75l-5.32-5.32A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm-1 2h2v1.5H13v2h-1.5V13h-2v-1.5H8v-2h1.5V8Z"/></svg></button>
            <i></i>
            <button id="fullscreen" type="button" title="全屏预览" aria-label="全屏预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4V4Zm10 0h6v6h-2V6h-4V4ZM6 14v4h4v2H4v-6h2Zm12 0h2v6h-6v-2h4v-4Z"/></svg></button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./vendor/mermaid.min.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
