<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="采用 Mermaid Live Editor 交互框架的智谱清言风 Mermaid 编辑器。">
  <title>Mermaid Live · 智谱清言风主题</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="编辑器首页">
        <span class="brand-mark" aria-hidden="true">M</span>
        <strong>Mermaid Live</strong>
        <span class="brand-note">智谱清言风</span>
      </a>
      <nav class="topnav" aria-label="主导航">
        <a href="./demo/">Gallery</a>
        <a href="https://github.com/Jeoitim/zhipu-mermaid-theme" target="_blank" rel="noreferrer">GitHub</a>
        <details id="actions-menu" class="actions-menu">
          <summary>Actions <span aria-hidden="true">⌄</span></summary>
          <div class="actions-popover">
            <header><strong>导出图表</strong><small>全部在浏览器本地完成</small></header>
            <div class="export-size">
              <span>PNG 尺寸</span>
              <label><input type="radio" name="png-size" value="auto" checked> 自动 2×</label>
              <label><input type="radio" name="png-size" value="width"> 宽度</label>
              <input id="png-width" type="number" min="320" max="10000" value="1920" disabled aria-label="PNG 宽度">
            </div>
            <div class="action-grid">
              <button id="download-png" type="button"><b>↓</b><span>PNG<small>高清位图</small></span></button>
              <button id="download-svg" type="button"><b>↓</b><span>SVG<small>可编辑矢量图</small></span></button>
              <button id="download-source" type="button"><b>↓</b><span>Mermaid<small>.mmd 源码</small></span></button>
            </div>
            <hr>
            <button id="copy-svg" class="wide-action" type="button">复制 SVG</button>
            <button id="copy-source" class="wide-action" type="button">复制 Mermaid 源码</button>
            <button id="share-link" class="wide-action" type="button">复制分享链接</button>
          </div>
        </details>
      </nav>
    </header>

    <main id="editor-shell" class="editor-shell">
      <section class="pane source-pane" aria-label="Mermaid 源码编辑区">
        <div class="pane-tabs">
          <button class="active-tab" type="button">Code</button>
          <span class="render-badge"><i id="render-indicator" class="status-dot ready"></i><span id="render-status">Ready</span></span>
          <div class="source-actions">
            <label><span>示例</span><select id="preset" aria-label="选择示例"><option value="timeline">Timeline</option><option value="graph">Flowchart</option><option value="gantt">Gantt</option></select></label>
            <label><span>布局</span><select id="layout" aria-label="Timeline 布局"><option value="auto">自适应</option><option value="mobile">移动纵向</option><option value="desktop">桌面横向</option></select></label>
          </div>
        </div>
        <div id="source-editor" class="source-editor" aria-label="Mermaid 源码"></div>
        <footer class="pane-footer"><span id="source-meta">Timeline</span><span>Ctrl / ⌘ + Enter 渲染</span></footer>
      </section>

      <div id="split-handle" class="split-handle" role="separator" aria-label="拖动调整编辑器与预览宽度" aria-orientation="vertical" tabindex="0"><span></span></div>

      <section id="preview-pane" class="pane preview-pane" aria-label="图表预览区">
        <div id="preview-surface" class="preview-surface" tabindex="0">
          <div id="preview" class="preview"></div>
          <div id="render-error" class="render-error" hidden></div>
          <div class="floating-toolbar" aria-label="图表视图控制">
            <button id="fit" type="button" title="重置并适应画布" aria-label="重置并适应画布">⌗</button>
            <i></i>
            <button id="zoom-out" type="button" title="缩小" aria-label="缩小">−</button>
            <button id="zoom-level" class="zoom-level" type="button" title="重置并适应画布">100%</button>
            <button id="zoom-in" type="button" title="放大" aria-label="放大">＋</button>
            <i></i>
            <button id="fullscreen" type="button" title="全屏预览" aria-label="全屏预览">⛶</button>
          </div>
        </div>
        <footer class="pane-footer preview-footer"><span id="diagram-meta">等待渲染</span><span>滚轮缩放 · 拖拽平移 · 双击复位</span></footer>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./vendor/mermaid.min.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
