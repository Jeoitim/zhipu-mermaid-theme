<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mermaid 主题图表示例画廊。">
  <title>Mermaid 主题展示</title>
  <link rel="icon" href="../icons/mermaid.svg" type="image/svg+xml">
  <script>document.documentElement.dataset.theme=localStorage.getItem("mermaid-editor-theme")||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light")</script>
  <style>html{background:#f1f5f9}html[data-theme="dark"]{background:#0f1117}body{margin:0}.gallery-brand img{width:26px;height:26px}.gallery-topbar svg{width:16px;height:16px}.gallery-topbar,.gallery-shell{opacity:0}.boot-splash{position:fixed;z-index:9999;inset:0;display:grid;place-items:center;background:inherit;transition:opacity .16s ease}.boot-splash img{width:34px;height:34px;animation:boot-pulse 1s ease-in-out infinite alternate}html.app-ready .gallery-topbar,html.app-ready .gallery-shell{opacity:1;transition:opacity .16s ease}html.app-ready .boot-splash{opacity:0;pointer-events:none}@keyframes boot-pulse{to{transform:scale(.9);opacity:.58}}</style>
</head>
<body>
  <div class="boot-splash" aria-hidden="true"><img src="../icons/mermaid.svg" width="34" height="34" alt=""></div>
  <header class="gallery-topbar">
    <a class="gallery-brand" href="../"><img src="../icons/mermaid.svg" width="26" height="26" alt=""><strong>Mermaid 主题展示</strong></a>
    <nav>
      <a class="primary-link" href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 4v10h14V8H5Zm3 2 3 3-3 3-1.4-1.4L8.2 13l-1.6-1.6L8 10Zm4 5h5v-2h-5v2Z"/></svg>打开编辑器</a>
      <a href="https://github.com/Jeoitim/zhipu-mermaid-theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7A11.3 11.3 0 0 0 8.4 22.8c.6.1.8-.2.8-.6v-2.1c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1.1-.8.1-.8.1-.8 1.2.1 1.9 1.3 1.9 1.3 1.1 1.9 2.9 1.4 3.6 1.1.1-.8.4-1.4.8-1.7-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A11.3 11.3 0 0 0 12 .7Z"/></svg>GitHub</a>
      <button id="gallery-theme-toggle" type="button" title="切换明暗模式" aria-label="切换明暗模式">
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8a8.5 8.5 0 1 0 11.6 11.6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 1h2v3h-2V1Zm0 19h2v3h-2v-3ZM1 11h3v2H1v-2Zm19 0h3v2h-3v-2ZM12 6a6 6 0 1 1 0 12 6 6 0 0 1 0-12Zm0 2a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
      </button>
    </nav>
  </header>
  <main class="gallery-shell">
    <div class="gallery-intro">
      <div><p>THEME GALLERY</p><h1>图表示例</h1></div>
      <p>集中展示响应式 Timeline 与常用 Mermaid 图表的统一配色。点击任意示例，可将源码带回主编辑器继续修改。</p>
    </div>
    <section id="gallery" class="gallery-grid" aria-label="Mermaid 图表示例"></section>
  </main>
  <script src="../vendor/mermaid.min.js"></script>
  <script type="module" src="/src/gallery.js"></script>
</body>
</html>
